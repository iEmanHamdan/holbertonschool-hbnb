<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - HBnB Mantu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
</head>
<body>

    <header>
        <a href="index.html">
            <img src="images/HBnB-Logo.png" alt="HBnB Logo" class="logo">
        </a>
        <nav>
            <a href="index.html" class="login-button">Home</a>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2 style="color: var(--hbnb-burgundy); text-align: center; margin-bottom: 20px;">Write a Review</h2>
            <form id="review-form" class="form">
                <div class="form-group">
                    <label for="rating">Rating (1 to 5)</label>
                    <select id="rating" name="rating" required>
                        <option value="5">5 - Excellent ★★★★★</option>
                        <option value="4">4 - Very Good ★★★★☆</option>
                        <option value="3">3 - Average ★★★☆☆</option>
                        <option value="2">2 - Poor ★★☆☆☆</option>
                        <option value="1">1 - Terrible ★☆☆☆☆</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="review-text">Your Review</label>
                    <textarea id="review-text" name="review" rows="5" placeholder="Share details of your stay..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Submit Review</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB Mantu. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
