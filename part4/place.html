<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details - HBnB Mantu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

    <header>
        <a href="index.html">
            <img src="images/HBnB-Logo.png" alt="HBnB Logo" class="logo">
        </a>
        <nav>
            <a href="index.html" class="login-button">Back to Places</a>
        </nav>
    </header>

    <main>
        <!-- Place Extended Details -->
        <section id="place-details" class="place-details">
            <!-- Dynamic place details injected here -->
        </section>

        <!-- Location Map Container -->
        <section>
            <h3 style="color: var(--dark-brown); margin-bottom: 10px;">Location</h3>
            <div id="place-map"></div>
        </section>

        <!-- Reviews Section -->
        <section class="place-details">
            <div class="review-header">
                <h3 style="color: var(--dark-brown);">Reviews</h3>
                <div id="add-review" class="add-review">
                    <a id="add-review-link" href="#" class="details-button">Add Review</a>
                </div>
            </div>
            <div id="reviews-list"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB Mantu. All rights reserved.</p>
    </footer>

    <!-- Leaflet JS for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
