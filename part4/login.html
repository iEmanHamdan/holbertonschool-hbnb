<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
</head>
<body>
    <header class="editorial-header">
        <div class="header-left">
            <a href="index.html" class="logo-container">
                <img src="images/HBnB-Logo.png" alt="Logo" class="logo">
            </a>
        </div>
        <div class="header-middle">
            <a href="index.html">
                <img src="images/home-icon.png" alt="Home" class="nav-icon"> Home
            </a>
            <a href="index.html#places-list">
                <img src="images/place-icon.png" alt="Places" class="nav-icon"> Places
            </a>
        </div>
        <div class="header-right">
            <a href="login.html" class="signup-button">Sign Up</a>
            <a href="login.html" id="login-link" class="login-button">Log In</a>
        </div>
    </header>

    <main>
        <form id="login-form" class="form">
            <h2>Login</h2>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Log In</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 HBnB Mantu. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
